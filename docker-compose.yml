name: barstock

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barstock}
      POSTGRES_USER: ${POSTGRES_USER:-barstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/barstock}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-barstock}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_local}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
