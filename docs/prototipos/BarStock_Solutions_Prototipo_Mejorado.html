class PrecioNormal{nombre='Precio normal';aplica(){return true}calcular(p){return p}}

class BarStockFacade{
 registrarComanda(items){if(!items.length)throw Error('Agregá al menos un trago');return transaction(venue=>{const normalized=items.map(x=>{const r=recipe(venue,x.recipeId);if(!r)throw Error('Receta inexistente');if(!Number.isInteger(x.qty)||x.qty<1||x.qty>99)throw Error('Cantidad inválida');return{recipeId:r.id,name:r.name,qty:x.qty}});const order={id:venue.nextOrder++,state:'Registrada',items:normalized,createdAt:now(),preparedAt:null,dispatchedAt:null,canceledAt:null,cancelReason:null,previousState:null,totals:null};venue.orders.unshift(order);addTrace(venue,'Facade',`registrarComanda() → #${order.id}, ${normalized.length} ítem(s)`);addTrace(venue,'State',`Comanda #${order.id} → Registrada`);return order.id})}
 preparar(id){return transaction(venue=>{const o=venue.orders.find(o=>o.id===id);if(!o)throw Error('Comanda inexistente');o.state=stateByName[o.state].preparar();o.preparedAt=now();addTrace(venue,'State',`Comanda #${id}: Registrada → En preparación`)})}
 despachar(id){return transaction((venue,events)=>{const o=venue.orders.find(o=>o.id===id);if(!o)throw Error('Comanda inexistente');const next=stateByName[o.state].despachar();const required=new Map();let income=0,cost=0;const sold=[];
  for(const item of o.items){const r=recipe(venue,item.recipeId);if(!r)throw Error('La receta ya no existe');const q=quote(venue,r);for(const part of r.parts){if(!ingredient(venue,part.ingredientId))throw Error('Insumo faltante en receta');required.set(part.ingredientId,(required.get(part.ingredientId)||0)+part.ml*item.qty)}income+=q.price*item.qty;cost+=q.cost*item.qty;sold.push({recipeId:r.id,name:r.name,qty:item.qty,unitPrice:q.price,unitCost:q.cost,policy:q.policy,floor:q.floor})}
  const shortages=[...required].filter(([k,ml])=>ingredient(venue,k).stock<ml).map(([k,ml])=>`${ingredient(venue,k).name}: faltan ${num(ml-ingredient(venue,k).stock)} ml`);if(shortages.length)throw Error('Stock insuficiente. No se realizó ningún descuento: '+shortages.join(' · '));
  const changes=[];for(const[k,ml]of required){const i=ingredient(venue,k),before=i.stock;i.stock=+(i.stock-ml).toFixed(4);changes.push({id:k,before,after:i.stock});venue.movements.unshift({at:now(),ingredientId:k,delta:-ml,type:'Consumo',note:`Comanda #${id}`})}
  o.state=next;o.dispatchedAt=now();o.totals={income,cost};o.sold=sold;addTrace(venue,'State',`Comanda #${id}: En preparación → Despachada`);addTrace(venue,'Strategy',`Precio fijado al despacho con ${strategy().nombre}`);addTrace(venue,'Facade',`Despacho atómico: ${required.size} insumo(s), total ${money(income)}`);events.push({type:'inventory-changed',changes});return income})}
 anular(id,reason){if(!reason||reason.trim().length<5)throw Error('Indicá un motivo de al menos 5 caracteres');return transaction(venue=>{const o=venue.orders.find(o=>o.id===id);if(!o)throw Error('Comanda inexistente');const previous=o.state;o.state=stateByName[o.state].anular();o.previousState=previous;o.cancelReason=reason.trim();o.canceledAt=now();addTrace(venue,'State',`Comanda #${id}: ${previous} → Anulada`);addTrace(venue,'Facade',previous==='Despachada'?`Reversión del ingreso de #${id}, SIN reponer ingredientes consumidos`:`Anulación de #${id}, sin modificar inventario`)})}
 comprar(id,packs){if(!Number.isInteger(packs)||packs<1||packs>50)throw Error('Cantidad de envases inválida');return transaction((venue,events)=>{const i=ingredient(venue,id);if(!i)throw Error('Insumo no encontrado');const before=i.stock,delta=i.pack*packs;i.stock+=delta;venue.movements.unshift({at:now(),ingredientId:id,delta,type:'Compra',note:`${packs} envase(s) · ${money(i.cost*packs)}`,spent:i.cost*packs});addTrace(venue,'Facade',`Compra: ${packs} envase(s) de ${i.name} (+${num(delta)} ml)`);events.push({type:'inventory-changed',changes:[{id,before,after:i.stock}]})})}
 auditar(counts){if(!counts.length)throw Error('Ingresá por lo menos un recuento físico');return transaction((venue,events)=>{const details=[],changes=[];for(const x of counts){const i=ingredient(venue,x.id);if(!i)throw Error('Insumo inexistente');if(!Number.isFinite(x.actual)||x.actual<0||x.actual>10000000)throw Error('Recuento físico inválido');const before=i.stock,delta=+(x.actual-before).toFixed(4),loss=delta<0?-delta*i.cost/i.pack:0;i.stock=x.actual;details.push({ingredientId:i.id,name:i.name,theoretical:before,physical:x.actual,delta,loss});if(delta){venue.movements.unshift({at:now(),ingredientId:i.id,delta,type:'Ajuste de auditoría',note:`Recuento físico #${venue.audits.length+1}`});changes.push({id:i.id,before,after:x.actual})}}const audit={id:venue.audits.length+1,at:now(),details,loss:details.reduce((s,x)=>s+x.loss,0)};venue.audits.unshift(audit);addTrace(venue,'Facade',`Auditoría #${audit.id}: ${details.length} insumo(s), merma ${money(audit.loss)}`);events.push({type:'inventory-changed',changes});return audit.loss})}
}

class ReporteBase{generar(venue){const fulfilled=venue.orders.filter(o=>o.dispatchedAt),paid=fulfilled.filter(o=>o.state==='Despachada'),reversed=fulfilled.filter(o=>o.state==='Anulada');return{revenue:paid.reduce((s,o)=>s+o.totals.income,0),grossCost:fulfilled.reduce((s,o)=>s+o.totals.cost,0),purchases:venue.movements.reduce((s,x)=>s+(x.spent||0),0),loss:venue.audits.reduce((s,x)=>s+x.loss,0),refunds:reversed.reduce((s,o)=>s+o.totals.income,0),orders:paid.length,sections:[]}}}

class ReporteConTendencias extends ReporteDecorator{generar(venue){const r=super.generar(venue),o=venue.orders.filter(o=>o.dispatchedAt).slice().reverse();const total=o.length,mid=Math.floor(total/2);const prev=o.slice(0,mid).filter(x=>x.state==='Despachada').reduce((s,x)=>s+x.totals.income,0);const curr=o.slice(mid).filter(x=>x.state==='Despachada').reduce((s,x)=>s+x.totals.income,0);r.sections.push({type:'trend',data:{prev,curr,comparable:mid>0&&total-mid>0}});return r}}

function renderStock(){const venue=v();const short=venue.ingredients.filter(i=>i.stock<=i.reorder);return page('Inventario y compras','Cada establecimiento administra sus propios insumos, costos por envase, stock fraccionado y puntos de reposición.',`<button class="btn btn-primary" data-action="ingredient-add">+ Nuevo insumo</button>`)+`<div class="cols-3 mb14"><div class="card"><div class="kpi-label">Insumos activos</div><div class="kpi-value">${venue.ingredients.length}</div><div class="kpi-detail">Catálogo de ${esc(venue.name)}</div></div><div class="card"><div class="kpi-label">Stock crítico</div><div class="kpi-value ${short.length?'kpi-warn':''}">${short.length}</div><div class="kpi-detail">Igual o menor al mínimo</div></div><div class="card"><div class="kpi-label">Valorización del stock</div><div class="kpi-value">${money(venue.ingredients.reduce((s,i)=>s+i.stock*i.cost/i.pack,0))}</div><div class="kpi-detail">Estimación al costo actual</div></div></div><div class="card"><div class="card-head"><div><h2>Stock disponible</h2><p>Comprá envases para reponer; los movimientos quedan registrados.</p></div><span class="pill p-info">Unidad base: ml</span></div><div class="table-wrap"><table><thead><tr><th>Insumo</th><th class="right">Stock (ml)</th><th>Nivel</th><th class="right">Reposición</th><th class="right">Costo/ml</th><th>Estado</th><th>Comprar</th></tr></thead><tbody>${venue.ingredients.map(i=>{const w=Math.max(0,Math.min(100,i.stock/(i.pack*2)*100));return `<tr><td><b>${esc(i.name)}</b><div class="record-sub">Envase ${num(i.pack)} ml · ${money(i.cost)}</div></td><td class="right ${i.stock<=i.reorder?'text-red strong':''}">${num(i.stock)}</td><td><div class="level"><span class="${i.stock<=i.reorder?'low':''}" style="width:${w}%"></span></div></td><td class="right">${num(i.reorder)} ml</td><td class="right">${money(i.cost/i.pack)}</td><td>${stockTag(i)}</td><td><button class="btn btn-small" data-action="buy" data-id="${esc(i.id)}">+ Envase</button></td></tr>`}).join('')}</tbody></table></div></div><div class="cols-half mt16"><div class="card"><div class="card-head"><div><h2>Movimientos de inventario</h2><p>Compras, consumos y ajustes físicos</p></div></div>${venue.movements.length?venue.movements.slice(0,9).map(m=>`<div class="record"><div><div class="record-label">${esc(m.type)} · ${esc(ingredient(venue,m.ingredientId)?.name||'Insumo retirado')}</div><div class="record-sub">${esc(m.note)} · ${esc(m.at)}</div></div><b class="small ${m.delta<0?'text-red':'text-green'}">${m.delta>0?'+':''}${num(m.delta)} ml</b></div>`).join(''):'<div class="empty">Todavía no hay movimientos.</div>'}</div><div class="card"><div class="card-head"><div><h2>Alertas activas</h2><p>Configuradas por cada insumo, no codificadas</p></div></div>${short.length?short.map(i=>`<div class="alert"><h4>${esc(i.name)} · reposición necesaria</h4><p>Quedan ${num(i.stock)} ml. Umbral: ${num(i.reorder)} ml.</p></div>`).join(''):'<div class="note success">Todos los insumos están por encima de su punto de reposición.</div>'}<div class="note info mt16">La compra ingresa envases completos al stock fraccionado en ml. La notificación externa por email está simulada; no se envían mensajes reales.</div></div></div>`}
function renderAudit(){const venue=v();return page('Auditoría de inventario','Al cierre de turno, compará las existencias calculadas contra el recuento físico y registrá los ajustes con trazabilidad.',`<button class="btn" data-action="simulate-audit">◈ Simular diferencia física</button>`)+`<div class="cols-2" style="grid-template-columns:1.4fr .8fr"><div class="card"><div class="card-head"><div><h2>Recuento físico</h2><p>Completá únicamente los insumos que querés auditar. Los campos vacíos no se modifican.</p></div><span class="pill p-info">Teórico vs. real</span></div><div class="table-wrap"><table><thead><tr><th>Insumo</th><th class="right">Teórico</th><th>Físico (ml)</th><th class="right">Diferencia</th><th class="right">Costo merma</th></tr></thead><tbody>${venue.ingredients.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td class="right">${num(i.stock)} ml</td><td><input class="input-small" type="number" min="0" step="0.01" inputmode="decimal" data-audit="${esc(i.id)}" value="${ui.auditDraft[i.id]??''}" placeholder="${num(i.stock)}"></td><td class="right" data-difference="${esc(i.id)}">—</td><td class="right" data-loss="${esc(i.id)}">—</td></tr>`).join('')}</tbody></table></div><div class="audit-foot"><div><div class="kpi-label">Merma preliminar</div><div class="price text-red" id="audit-total">$ 0</div><div class="tiny muted" id="audit-count">Sin recuentos cargados</div></div><button class="btn btn-primary" data-action="save-audit">Registrar cierre y ajustar stock →</button></div></div><div><div class="card"><div class="card-head"><div><h2>Cómo se calcula</h2><p>Regla de auditoría</p></div></div><div class="step"><div class="step-n">1</div><div><h4>Stock teórico</h4><p>Existencias iniciales + compras − consumos ± ajustes.</p></div></div><div class="step"><div class="step-n">2</div><div><h4>Conteo físico</h4><p>El encargado registra la cantidad realmente medida.</p></div></div><div class="step"><div class="step-n">3</div><div><h4>Variación y ajuste</h4><p>Diferencia = físico − teórico. Una diferencia negativa se valoriza como merma.</p></div></div><div class="note info mt16">Para esta demo, el recuento ajusta el stock al valor físico. Los ajustes y la merma se registran en el historial.</div></div></div><div class="card mt16"><div class="card-head"><div><h2>Historial de cierres</h2><p>Auditorías registradas para este establecimiento</p></div><span class="pill">${venue.audits.length} auditorías</span></div>${venue.audits.length?venue.audits.slice(0,8).map(a=>`<div class="record"><div><div class="record-label">Cierre #${a.id} · ${esc(a.at)}</div><div class="record-sub">${a.details.length} insumos · ${a.details.filter(x=>x.delta!==0).length} diferencias detectadas</div></div><b class="${a.loss?'text-red':''}">${money(a.loss)}</b></div>`).join(''):'<div class="empty">Aún no se realizaron recuentos.</div>'}</div></div>`}
function renderReports(){const venue=v(),report=new ReporteConTendencias(new ReporteConGrafico(new ReporteBase())).generar(venue),ranking=report.sections.find(x=>x.type==='ranking').data,trend=report.sections.find(x=>x.type==='trend').data,margin=report.revenue-report.grossCost;return page('Reportes y rentabilidad','Seguimiento de ventas, costos de ingredientes, compras y mermas. Decorator agrega ranking y tendencias al reporte base.',`<span class="pill p-info">ReporteBase + 2 Decorators</span>`)+`<div class="cols-4"><div class="card"><div class="kpi-label">Ventas netas</div><div class="kpi-value">${money(report.revenue)}</div><div class="kpi-detail">${report.orders} comandas cobradas</div></div><div class="card"><div class="kpi-label">Contribución por tragos</div><div class="kpi-value ${margin<0?'kpi-warn':'kpi-accent'}">${money(margin)}</div><div class="kpi-detail">Ventas netas menos insumos consumidos</div></div><div class="card"><div class="kpi-label">Compras registradas</div><div class="kpi-value">${money(report.purchases)}</div><div class="kpi-detail">Entradas de stock (no restan aquí otra vez)</div></div><div class="card"><div class="kpi-label">Pérdidas por merma</div><div class="kpi-value kpi-warn">${money(report.loss)}</div><div class="kpi-detail">Diferencias físicas negativas auditadas</div></div></div><div class="cols-half mt16"><div class="card"><div class="card-head"><div><h2>Ranking de tragos</h2><p>ReporteConGrafico · cantidad vendida</p></div></div>${ranking.length?ranking.map(([name,count])=>`<div class="bar-chart"><div class="bar-label">${esc(name)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,count/ranking[0][1]*100)}%"></div></div><div class="bar-total">${count}</div></div>`).join(''):'<div class="empty">Despachá alguna comanda para ver el ranking.</div>'}</div><div class="card"><div class="card-head"><div><h2>Tendencia de ventas</h2><p>ReporteConTendencias · comparación exploratoria</p></div></div>${trend.comparable?`<div class="cols-half" style="gap:10px"><div class="secondary-stat"><div class="kpi-label">Primera mitad de órdenes</div><strong>${money(trend.prev)}</strong></div><div class="secondary-stat"><div class="kpi-label">Segunda mitad de órdenes</div><strong>${money(trend.curr)}</strong></div></div><div class="note info mt16">Comparación por orden de despacho del historial; no es una predicción estadística.</div>`:'<div class="empty">Se necesitan al menos dos despachos para comparar períodos de actividad.</div>'}<div class="divider"></div><div class="record"><div><div class="record-label">Ingresos revertidos por devoluciones</div><div class="record-sub">Costos de ingredientes no se reintegran</div></div><b>${money(report.refunds)}</b></div></div></div><div class="card mt16"><div class="card-head"><div><h2>Transparencia de cálculo</h2><p>Cifras orientativas; recetas y precios configurables por bar</p></div></div><div class="flow"><div class="secondary-stat"><div class="kpi-label">Margen de contribución</div><strong>${report.revenue?`${((margin/report.revenue)*100).toFixed(1)} %`:'—'}</strong><div class="tiny muted">No es utilidad neta del negocio.</div></div><div class="secondary-stat"><div class="kpi-label">Costo de ingredientes consumidos</div><strong>${money(report.grossCost)}</strong><div class="tiny muted">Incluye comandas despachadas luego devueltas.</div></div><div class="secondary-stat"><div class="kpi-label">Recuentos registrados</div><strong>${venue.audits.length}</strong><div class="tiny muted">Auditorías con historial local.</div></div></div><div class="note mt16">Las cifras no incluyen sueldos, alquiler, impuestos, comisiones ni otros costos operativos. La persistencia se hace en el navegador, no en una base de datos.</div></div>`}
function renderConfig(){const venue=v();return page('Configuración del bar','Editá el establecimiento, sus insumos y recetas. Cambiar de bar mantiene inventarios, comandas e informes independientes.',`<button class="btn btn-primary" data-action="venue-new">+ Agregar establecimiento</button>`)+`<div class="cols-half"><div class="card"><div class="card-head"><div><h2>Establecimiento activo</h2><p>Identidad y datos configurables del local.</p></div><span class="pill p-info">${state.venues.length} bares</span></div><div class="flex gap12" style="align-items:flex-start"><div class="brand-icon" style="width:53px;height:53px;flex-shrink:0">🍸</div><div><h2>${esc(venue.name)}</h2><p class="muted small">${esc(venue.area)} · ${esc(venue.desc)}</p><button class="btn btn-small" data-action="venue-edit">Editar datos</button></div></div><div class="divider"></div><div class="small strong mb8">Cambiar de establecimiento</div>${state.venues.map(x=>`<div class="record"><div><div class="record-label">${esc(x.name)}</div><div class="record-sub">${esc(x.area)} · ${x.recipes.length} recetas · ${x.ingredients.length} insumos</div></div><button class="btn btn-small ${x.id===venue.id?'btn-green':''}" data-action="venue-select" data-id="${esc(x.id)}">${x.id===venue.id?'Activo':'Cambiar'}</button></div>`).join('')}<div class="note info mt16">Los datos están separados por establecimiento dentro del prototipo. Esto no constituye seguridad multiusuario ni multi-tenant en servidor.</div></div><div class="card"><div class="card-head"><div><h2>Recetas del menú</h2><p>Los tragos se crean con insumos del catálogo del bar.</p></div><button class="btn btn-small btn-primary" data-action="recipe-add">+ Receta</button></div>${venue.recipes.length?venue.recipes.map(r=>`<div class="config-item"><div style="min-width:0"><div class="record-label">${esc(r.icon)} ${esc(r.name)}</div><div class="record-sub">${r.parts.map(p=>`${num(p.ml)} ml ${esc(ingredient(venue,p.ingredientId)?.name||'?')}`).join(' · ')}</div><div class="small"><b>${money(r.price)}</b> <span class="muted">base</span></div></div><div class="flex gap6"><button class="btn btn-small" data-action="recipe-edit" data-id="${esc(r.id)}">Editar</button><button class="btn btn-small btn-danger" data-action="recipe-delete" data-id="${esc(r.id)}">×</button></div></div>`).join(''):'<div class="empty">Sin recetas todavía.</div>'}</div></div><div class="card mt16"><div class="card-head"><div><h2>Insumos configurables</h2><p>Los cambios de costo y umbral afectan futuras operaciones; las ventas anteriores conservan su precio registrado.</p></div><button class="btn btn-small btn-primary" data-action="ingredient-add">+ Insumo</button></div><div class="table-wrap"><table><thead><tr><th>Ingrediente</th><th class="right">Envase</th><th class="right">Costo envase</th><th class="right">Stock actual</th><th class="right">Mínimo</th><th>Acciones</th></tr></thead><tbody>${venue.ingredients.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td class="right">${num(i.pack)} ml</td><td class="right">${money(i.cost)}</td><td class="right">${num(i.stock)} ml</td><td class="right">${num(i.reorder)} ml</td><td><button class="btn btn-small" data-action="ingredient-edit" data-id="${esc(i.id)}">Editar</button></td></tr>`).join('')}</tbody></table></div></div><div class="card mt16"><div class="card-head"><div><h2>Alcance de esta demostración</h2><p>Qué es real en el prototipo y qué queda pendiente para la aplicación Java</p></div></div><div class="cols-half"><div class="note success"><b>Implementado en JavaScript</b><div class="mt8">Configuración por bar, recetas e insumos, estados, despacho validado, descuentos en ml, compras, auditorías, reportes y guardado local.</div></div><div class="note info"><b>No implementado todavía</b><div class="mt8">Backend Java, transacciones ACID de base de datos, autenticación, correo/SMS reales, integraciones POS, predicción avanzada y multiusuario concurrente.</div></div></div></div>`}
function liveAudit(){let loss=0,count=0;$$('[data-audit]').forEach(el=>{const i=ingredient(v(),el.dataset.audit);if(!i)return;const raw=el.value.trim(),d=$(`[data-difference="${CSS.escape(i.id)}"]`),c=$(`[data-loss="${CSS.escape(i.id)}"]`);if(raw===''||!Number.isFinite(+raw)||+raw<0){d.textContent='—';c.textContent='—';return}const diff=+raw-i.stock,m=diff<0?-diff*i.cost/i.pack:0;loss+=m;count++;d.textContent=(diff>0?'+':'')+num(diff)+' ml';d.className='right '+(diff<0?'text-red':diff>0?'text-green':'');c.textContent=money(m)});const el=$('#audit-total');if(el)el.textContent=money(loss);const co=$('#audit-count');if(co)co.textContent=count?`${count} insumo(s) con recuento`:'Sin recuentos cargados'}
function setView(name){ui.tab=name;ui.auditDraft={};render();window.scrollTo({top:0,behavior:'smooth'})}
function notify(message,isError=false){const t=$('#toast');t.innerHTML=`<span>${isError?'⚠':'✓'} ${esc(message)}</span><button type="button" data-action="toast-close" aria-label="Cerrar">×</button>`;t.className='toast'+(isError?' error':'')}
function modal(title,body,onSubmit,submit='Guardar'){const d=$('#modal');$('#modal-body').innerHTML=`<div class="dialog-head"><div><div class="eyebrow">BarStock Solutions</div><h2>${esc(title)}</h2></div><button class="icon-close" type="button" data-action="modal-close" aria-label="Cerrar">×</button></div><form id="modal-form"><div>${body}</div><div class="actions-row mt16"><button class="btn" type="button" data-action="modal-close">Cancelar</button><button class="btn btn-primary" type="submit">${esc(submit)}</button></div></form>`;d._submit=onSubmit;if(!d.open)d.showModal()}
function closeModal(){const d=$('#modal');if(d.open)d.close();d._submit=null}
function getForm(form){return Object.fromEntries(new FormData(form).entries())}
function validNumber(raw,label,{min=0,positive=false}={}){const n=Number(raw);if(raw===''||!Number.isFinite(n)||n<min||(positive&&n===0))throw Error(`${label}: ingresá un número válido${positive?' mayor a cero':''}`);return n}
function formVenue(old){modal(old?'Editar establecimiento':'Crear establecimiento',`<div class="fieldrow"><div class="field"><label>Nombre del establecimiento</label><input name="name" maxlength="60" required value="${esc(old?.name||'')}"></div><div class="field"><label>Barrio / ubicación</label><input name="area" maxlength="70" required value="${esc(old?.area||'')}"></div></div><div class="field mt12"><label>Descripción</label><input name="desc" maxlength="110" required value="${esc(old?.desc||'Bar de coctelería')}"></div><p class="muted small mt12">Los nuevos establecimientos comienzan con catálogo vacío; podés configurar sus insumos y recetas desde esta misma vista.</p>`,form=>{const d=getForm(form);if(!d.name.trim()||!d.area.trim())throw Error('Completá el nombre y la ubicación');if(old){transaction(venue=>{venue.name=d.name.trim();venue.area=d.area.trim();venue.desc=d.desc.trim()})}else{const id=uid('bar');state.venues.push({id,name:d.name.trim(),area:d.area.trim(),desc:d.desc.trim(),ingredients:[],recipes:[],orders:[],movements:[],audits:[],notifications:[],traces:[],nextOrder:1});state.activeId=id;ui.cart=[];save();render()}notify('Establecimiento guardado')})}
function formIngredient(old){modal(old?'Editar insumo':'Agregar insumo',`<div class="fieldrow"><div class="field"><label>Nombre</label><input name="name" maxlength="60" required value="${esc(old?.name||'')}"></div><div class="field"><label>Contenido por envase (ml)</label><input name="pack" type="number" step="0.01" min="0.01" required value="${old?.pack??750}"></div><div class="field"><label>Costo del envase (ARS)</label><input name="cost" type="number" step="0.01" min="0" required value="${old?.cost??10000}"></div><div class="field"><label>Punto de reposición (ml)</label><input name="reorder" type="number" step="0.01" min="0" required value="${old?.reorder??250}"></div></div>${!old?`<div class="field mt12"><label>Stock inicial (ml)</label><input name="stock" type="number" step="0.01" min="0" required value="750"></div>`:'<div class="note info mt12">El stock existente no se modifica desde esta ficha. Para eso usá Compras o Auditoría.</div>'}`,form=>{const d=getForm(form),pack=validNumber(d.pack,'Contenido',{positive:true}),cost=validNumber(d.cost,'Costo'),reorder=validNumber(d.reorder,'Punto de reposición'),stock=old?null:validNumber(d.stock,'Stock inicial');if(!d.name.trim())throw Error('Ingresá el nombre');transaction(venue=>{if(old){const i=ingredient(venue,old.id);Object.assign(i,{name:d.name.trim(),pack,cost,reorder})}else venue.ingredients.push({id:uid('insumo'),name:d.name.trim(),pack,cost,stock,reorder});addTrace(venue,'Facade',`${old?'Actualizó':'Registró'} insumo ${d.name.trim()}`)});notify('Insumo guardado')})}
function formRecipe(old){if(!v().ingredients.length){notify('Primero agregá un insumo a este establecimiento',true);return}const choices=v().ingredients.map(i=>`<option value="${esc(i.id)}">${esc(i.name)}</option>`).join('');modal(old?'Editar receta':'Crear receta',`<div class="fieldrow"><div class="field"><label>Nombre de trago</label><input name="name" required maxlength="60" value="${esc(old?.name||'')}"></div><div class="field"><label>Precio base (ARS)</label><input name="price" required type="number" min="0.01" step="0.01" value="${old?.price??7000}"></div></div><div class="field mt12"><label>Icono del menú</label><select name="icon">${['🍹','🍸','🥃','🍷','🥤','🍺'].map(i=>`<option value="${i}" ${i===(old?.icon||'🍹')?'selected':''}>${i}</option>`).join('')}</select></div><div class="flex between mt16 mb8"><div class="strong small">Ingredientes y mililitros por unidad</div><button class="btn btn-small" type="button" data-action="part-add">+ Ingrediente</button></div><div id="parts-list">${(old?.parts?.length?old.parts:[{ingredientId:v().ingredients[0].id,ml:50}]).map(p=>partRow(p,choices)).join('')}</div><div class="note info mt12">Las recetas son libres por establecimiento. Un ingrediente puede formar parte de múltiples recetas.</div>`,form=>{const d=getForm(form),price=validNumber(d.price,'Precio',{positive:true}),parts=$$('#parts-list .partrow').map(row=>({ingredientId:row.querySelector('[data-part-id]').value,ml:validNumber(row.querySelector('[data-part-ml]').value,'Cantidad por ingrediente',{positive:true})}));if(!d.name.trim()||!parts.length)throw Error('Ingresá nombre y al menos un ingrediente');if(new Set(parts.map(p=>p.ingredientId)).size!==parts.length)throw Error('No repitas ingredientes dentro de la misma receta');transaction(venue=>{for(const p of parts)if(!ingredient(venue,p.ingredientId))throw Error('Ingrediente inválido');if(old){const r=recipe(venue,old.id);Object.assign(r,{name:d.name.trim(),price,icon:d.icon,parts})}else venue.recipes.push({id:uid('receta'),name:d.name.trim(),price,icon:d.icon,parts});addTrace(venue,'Facade',`${old?'Actualizó':'Registró'} receta ${d.name.trim()}`)});notify('Receta guardada')})}
function partRow(p,opts){return `<div class="partrow"><select data-part-id aria-label="Insumo de receta">${opts.replace(`value="${esc(p.ingredientId)}"`,`value="${esc(p.ingredientId)}" selected`)}</select><input data-part-ml aria-label="Cantidad en ml" type="number" step="0.01" min="0.01" required value="${p.ml}"><button type="button" data-action="part-remove" aria-label="Eliminar ingrediente">×</button></div>`}
function formBuy(id){const i=ingredient(v(),id);modal(`Reponer ${i.name}`,`<div class="note info mb14">Compra de envases completos. Cada uno agrega <b>${num(i.pack)} ml</b> y cuesta <b>${money(i.cost)}</b>.</div><div class="field"><label>Cantidad de envases</label><input name="packs" type="number" min="1" max="50" step="1" required value="1"></div>`,f=>{const d=getForm(f),n=+d.packs;if(!Number.isInteger(n))throw Error('Cantidad entera obligatoria');facade.comprar(id,n);notify(`Compra registrada: ${n} envase(s) de ${i.name}`)},'Registrar compra')}
function formCancel(id){const o=v().orders.find(o=>o.id===id);const after=o.state==='Despachada';modal(after?`Devolución de comanda #${id}`:`Anular comanda #${id}`,`<div class="note ${after?'danger':'info'} mb14">${after?'Se revierte el ingreso registrado, pero NO se devuelven los mililitros ya consumidos al inventario.':'No se descuenta ni reintegra inventario, porque el despacho todavía no ocurrió.'}</div><div class="field"><label>Motivo obligatorio</label><textarea name="reason" rows="3" maxlength="220" placeholder="Ej.: error de pedido, trago devuelto..." required></textarea></div>`,f=>{facade.anular(id,getForm(f).reason);notify(`Comanda #${id} anulada`)},'Confirmar anulación')}
function demoScenario(){const venue=v();let r=venue.recipes.find(x=>x.parts.some(p=>ingredient(venue,p.ingredientId)?.name.toLowerCase().includes('campari')))||venue.recipes.find(x=>x.parts.length>1)||venue.recipes[0];if(!r){notify('Agregá una receta para preparar el escenario',true);return}transaction(working=>{const rr=recipe(working,r.id),part=rr.parts[0],i=ingredient(working,part.ingredientId),needs=part.ml;i.reorder=Math.max(1,Math.round(needs*1.3));const oldStock=i.stock;i.stock=+(needs+i.reorder/2).toFixed(2);working.movements.unshift({at:now(),ingredientId:i.id,delta:+(i.stock-oldStock).toFixed(4),type:'Preparación de demo',note:'Ajuste intencional para mostrar alerta de reposición'});working.orders.unshift({id:working.nextOrder++,state:'Registrada',items:[{recipeId:rr.id,name:rr.name,qty:1}],createdAt:now(),preparedAt:null,dispatchedAt:null,canceledAt:null,cancelReason:null,previousState:null,totals:null});addTrace(working,'Facade',`Escenario preparado: ${rr.name}, stock de ${i.name} cerca del reorden`)});ui.cart=[];setView('barra');notify(`Escenario listo: prepará y despachá ${r.name} para activar Observer`)}
function guideModal(){modal('Guía para defender el prototipo',`<div class="guide-highlight mb14"><div class="strong">Guion de 5 minutos · TPO Grupo 4</div><div class="muted small">Recomendación: empezá desde Resumen, prepará el escenario y seguí el flujo.</div></div><ol class="small" style="padding-left:22px;line-height:1.8"><li><b>0:00–0:40 · Problema:</b> el stock de botellas abiertas no se descuenta automáticamente.</li><li><b>0:40–1:20 · Configuración:</b> cambiar entre Bar Ámbar y La Esquina; mostrar menús diferentes.</li><li><b>1:20–2:50 · Barra:</b> registrar, preparar y despachar la comanda del escenario. Mostrar descuento y alerta.</li><li><b>2:50–3:35 · Stock:</b> comprobar cantidades descontadas y realizar una compra.</li><li><b>3:35–4:20 · Auditoría:</b> simular recuento físico, guardar y observar merma.</li><li><b>4:20–5:00 · Reportes:</b> explicar costo, ingresos, ranking y los seis patrones.</li></ol><div class="note info mt14">Alcance: interfaz demostrativa HTML/JavaScript con localStorage. No representa backend Java, DB transaccional ni envío de correos.</div>`,()=>{},'Cerrar');$('#modal-form').onsubmit=e=>{e.preventDefault();closeModal()}}
function patternsModal(){modal('Seis patrones aplicados',`<div class="pattern-grid" style="grid-template-columns:repeat(2,1fr)">${patterns.map(([id,m,d])=>`<div class="pattern"><div class="pattern-id">${esc(id)}</div><h3>${esc(m)}</h3><p>${esc(d)}</p></div>`).join('')}</div><div class="note info mt14">Esta es una implementación demostrativa JavaScript inspirada en los UML; las clases definitivas en Java pueden requerir ajustes.</div>`,()=>{},'Cerrar');$('#modal-form').onsubmit=e=>{e.preventDefault();closeModal()}}
const handlers={
 'toast-close':()=>$('#toast').classList.add('hidden'),guide:guideModal,patterns:patternsModal,
 reset:()=>{if(!confirm('¿Reiniciar todos los bares y borrar los datos de esta demo?'))return;state=sampleData();ui.cart=[];ui.auditDraft={};save();setView('resumen');notify('Demo reiniciada con los datos iniciales')},
 scenario:demoScenario,
 'cart-add':b=>{const r=recipe(v(),b.dataset.id);if(!r)throw Error('Receta inexistente');const it=ui.cart.find(x=>x.recipeId===r.id);if(it)it.qty=Math.min(99,it.qty+1);else ui.cart.push({recipeId:r.id,qty:1});render()},
 'cart-minus':b=>{const it=ui.cart.find(x=>x.recipeId===b.dataset.id);if(!it)return;it.qty--;if(it.qty<=0)ui.cart=ui.cart.filter(x=>x!==it);render()},
 register:()=>{const id=facade.registrarComanda(ui.cart);ui.cart=[];render();notify(`Comanda #${id} registrada; iniciá la preparación`)},
 prepare:b=>{facade.preparar(+b.dataset.id);notify('Comanda en preparación')},
 dispatch:b=>{const total=facade.despachar(+b.dataset.id);notify(`Comanda despachada. Total ${money(total)}; stock actualizado`)},
 cancel:b=>formCancel(+b.dataset.id),buy:b=>formBuy(b.dataset.id),
 'simulate-audit':()=>{const i=v().ingredients.find(x=>x.stock>=15)||v().ingredients[0];if(!i)throw Error('No hay insumos');ui.auditDraft={...ui.auditDraft,[i.id]:Math.max(0,+(i.stock-Math.min(20,i.stock)).toFixed(2)).toString()};render();notify(`Recuento simulado: ${i.name} tiene menos stock físico`)},
 'save-audit':()=>{const counts=Object.entries(ui.auditDraft).filter(([id,raw])=>raw!=='').map(([id,raw])=>({id,actual:Number(raw)}));const total=facade.auditar(counts);ui.auditDraft={};render();notify(`Auditoría registrada. Merma detectada: ${money(total)}`)},
 'ingredient-add':()=>formIngredient(null),'ingredient-edit':b=>formIngredient(ingredient(v(),b.dataset.id)),
 'recipe-add':()=>formRecipe(null),'recipe-edit':b=>formRecipe(recipe(v(),b.dataset.id)),
 'recipe-delete':b=>{const r=recipe(v(),b.dataset.id);if(!r)return;const referenced=v().orders.some(o=>o.items.some(i=>i.recipeId===r.id));if(referenced)throw Error('Esta receta figura en comandas anteriores; editála en lugar de eliminarla');if(!confirm(`¿Eliminar la receta ${r.name}?`))return;transaction(venue=>{venue.recipes=venue.recipes.filter(x=>x.id!==r.id)});ui.cart=ui.cart.filter(x=>x.recipeId!==r.id);render();notify('Receta eliminada')},
 'venue-new':()=>formVenue(null),'venue-edit':()=>formVenue(v()),
 'venue-select':b=>switchVenue(b.dataset.id),
 'modal-close':closeModal,
 'part-add':()=>{const i=v().ingredients[0];if(!i)return;const opts=v().ingredients.map(i=>`<option value="${esc(i.id)}">${esc(i.name)}</option>`).join('');$('#parts-list').insertAdjacentHTML('beforeend',partRow({ingredientId:i.id,ml:50},opts))},
 'part-remove':b=>{if($$('#parts-list .partrow').length<=1)throw Error('La receta necesita al menos un ingrediente');b.closest('.partrow').remove()}
};
function switchVenue(id){if(!state.venues.some(x=>x.id===id))return;state.activeId=id;ui.cart=[];ui.auditDraft={};save();render();notify(`Establecimiento activo: ${v().name}`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.nav){setView(b.dataset.nav);return}const action=b.dataset.action;if(action&&handlers[action])handlers[action](b)}catch(err){console.error(err);notify(err.message,true)}});
document.addEventListener('change',e=>{if(e.target.id==='venue-sidebar'||e.target.id==='venue-mobile')switchVenue(e.target.value);if(e.target.id==='hour-select'){state.hour=+e.target.value;save();render();notify(`Hora simulada: ${formatHour(state.hour)} · ${strategy().nombre}`)}});
document.addEventListener('input',e=>{if(e.target.dataset.audit){ui.auditDraft[e.target.dataset.audit]=e.target.value;liveAudit()}});
$('#modal').addEventListener('submit',e=>{if(e.target.id!=='modal-form')return;e.preventDefault();try{const callback=$('#modal')._submit;if(callback)callback(e.target);closeModal()}catch(err){notify(err.message,true)}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
state=load();if(!v())state=sampleData();save();render();
</script>
</body>
</html>
