name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Tests unitarios e integración con PostgreSQL
        working-directory: backend
        run: sh mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Construir y arrancar el entorno
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Verificar frontend, API y proxy
        run: |
          curl --fail http://localhost:3000/
          curl --fail http://localhost:3000/api
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:8080/api
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Apagar el entorno de CI
        if: always()
        run: docker compose down --volumes
